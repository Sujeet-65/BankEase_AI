<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>BankEase – Profile</title>
<style>
  :root{--p:#6366f1;--d:#4f46e5;--dk:#1e1b4b;--l:#eef2ff;--err:#ef4444;--ok:#10b981;--warn:#f59e0b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f8f9ff;display:flex;min-height:100vh;color:#1f2937}
  /* Sidebar */
  .sidebar{width:260px;background:linear-gradient(180deg,var(--dk),#312e81);min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .sb-logo{display:flex;align-items:center;gap:10px;padding:24px 24px 20px;font-size:1.25rem;font-weight:800;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
  .sb-logo .icon{width:36px;height:36px;background:rgba(99,102,241,.4);border-radius:10px;display:flex;align-items:center;justify-content:center}
  .sb-user{padding:16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
  .sb-avatar{width:40px;height:40px;background:linear-gradient(135deg,var(--p),var(--d));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
  .sb-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .sb-name{color:#fff;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-role{color:rgba(255,255,255,.5);font-size:.75rem}
  nav.sb-nav{flex:1;padding:0 12px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.9rem;font-weight:500;transition:all .2s;margin-bottom:4px}
  .nav-item:hover,.nav-item.active{background:rgba(255,255,255,.12);color:#fff}
  .nav-item.active{background:rgba(99,102,241,.35);color:#fff}
  .nav-item .ni{font-size:1.1rem;width:20px;text-align:center}
  .sb-logout{margin:0 12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.6);background:none;border:none;font-size:.9rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);transition:.2s}
  .sb-logout:hover{background:rgba(239,68,68,.2);color:#fca5a5}
  /* Main */
  .main{flex:1;padding:32px 36px;overflow-y:auto}
  .page-title{font-size:1.6rem;font-weight:800;color:var(--dk);margin-bottom:4px}
  .page-sub{color:#6b7280;font-size:.9rem;margin-bottom:32px}
  /* Cards */
  .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 2px 16px rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.08)}
  .card-sm{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.06)}
  /* Grid */
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  /* Form */
  label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:5px}
  input,select,textarea{width:100%;padding:11px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:.92rem;font-family:'Inter',sans-serif;outline:none;transition:border .2s;color:#1f2937}
  input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
  .field{margin-bottom:16px}
  .btn{padding:10px 22px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;border:none;transition:.25s;display:inline-flex;align-items:center;gap:7px}
  .btn-p{background:linear-gradient(135deg,var(--p),var(--d));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
  .btn-outline{border:2px solid var(--p);color:var(--p);background:transparent}
  .btn-danger{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .btn-danger:hover{background:var(--err);color:#fff}
  .btn-ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  .btn-ok:hover{background:var(--ok);color:#fff}
  /* Badges */
  .badge{padding:3px 10px;border-radius:50px;font-size:.75rem;font-weight:600}
  .badge-ok{background:#f0fdf4;color:var(--ok)}
  .badge-err{background:#fef2f2;color:var(--err)}
  .badge-warn{background:#fffbeb;color:var(--warn)}
  .badge-blue{background:var(--l);color:var(--p)}
  /* Alert */
  .alert{padding:12px 16px;border-radius:10px;font-size:.88rem;font-weight:500;margin-bottom:16px;display:none}
  .alert.show{display:block}
  .alert.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .alert.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  /* Table */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  th{background:#f9fafb;color:#374151;font-weight:600;padding:12px 16px;text-align:left;border-bottom:2px solid #e5e7eb;white-space:nowrap}
  td{padding:12px 16px;border-bottom:1px solid #f3f4f6;color:#4b5563;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafafa}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;padding:32px;max-width:460px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.2)}
  .modal h3{font-size:1.2rem;font-weight:700;color:var(--dk);margin-bottom:20px}
  @media(max-width:768px){.sidebar{width:64px}.sb-name,.sb-role,.sb-user .sb-name,.sb-user .sb-role,.sb-logo span,.nav-item span,.sb-logout span{display:none}.main{padding:20px 16px}}

  .avatar-wrap{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--d));display:flex;align-items:center;justify-content:center;font-size:2.8rem;color:#fff;font-weight:800;overflow:hidden;cursor:pointer;position:relative;flex-shrink:0}
  .avatar-wrap img{width:100%;height:100%;object-fit:cover}
  .avatar-wrap::after{content:'📷';position:absolute;bottom:0;right:0;width:30px;height:30px;background:var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;border:2px solid #fff}
  .profile-row{display:flex;align-items:flex-start;gap:28px;margin-bottom:32px}
  .profile-main{flex:1}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo"><div class="icon">🏦</div><span>BankEase</span></div>
  <div class="sb-user">
    <div class="sb-avatar" id="sb-avatar">U</div>
    <div><div class="sb-name" id="sb-name">Loading...</div><div class="sb-role" id="sb-role">User</div></div>
  </div>
  <nav class="sb-nav">
      <a href="/dashboard.html" class="nav-item ACTIVE_D"><span class="ni">🏠</span><span>Dashboard</span></a>
      <a href="/statement.html" class="nav-item ACTIVE_S"><span class="ni">📋</span><span>Statements</span></a>
      <a href="/profile.html" class="nav-item active"><span class="ni">👤</span><span>Profile</span></a>
      <a href="/chatbot.html" class="nav-item ACTIVE_C"><span class="ni">🤖</span><span>AI Assistant</span></a>
      <a href="/support.html" class="nav-item ACTIVE_SU"><span class="ni">🎫</span><span>Support</span></a>
    </nav>
  <button class="sb-logout" onclick="logout()"><span class="ni">🚪</span><span>Logout</span></button>
</div>
<div class="main">
  <div class="page-title">My Profile</div>
  <div class="page-sub">Manage your personal information and account settings.</div>
  <div class="alert" id="alert"></div>

  <div class="card">
    <div class="profile-row">
      <div>
        <div class="avatar-wrap" id="avatar-wrap" onclick="document.getElementById('img-input').click()"></div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImage(event)">
        <div style="font-size:.72rem;color:#9ca3af;text-align:center;margin-top:8px">Click to change</div>
      </div>
      <div class="profile-main">
        <div style="font-size:1.5rem;font-weight:800;color:var(--dk)" id="hdr-name">Loading...</div>
        <div style="color:#6b7280;font-size:.9rem;margin-top:2px" id="hdr-email">—</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <span class="badge badge-ok">✅ Active Account</span>
          <span class="badge badge-blue" id="hdr-acct">ACCT-...</span>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Full Name</label><input type="text" id="f-name" placeholder="Full Name"></div>
      <div class="field"><label>Username / Email</label><input type="text" id="f-user" placeholder="email@gmail.com"></div>
      <div class="field"><label>Phone</label><input type="tel" id="f-phone" placeholder="+91..."></div>
      <div class="field"><label>Date of Birth</label><input type="date" id="f-dob"></div>
      <div class="field"><label>Aadhaar Number</label><input type="text" id="f-aadhaar" maxlength="12" placeholder="12-digit Aadhaar"></div>
      <div class="field"><label>PAN Number</label><input type="text" id="f-pan" maxlength="10" placeholder="ABCDE1234F"></div>
      <div class="field"><label>New PIN (4-digit)</label><input type="password" id="f-pin" maxlength="4" placeholder="Leave blank to keep current"></div>
    </div>
    <div class="field"><label>Address</label><textarea id="f-addr" rows="2" placeholder="Full address"></textarea></div>
    <button class="btn btn-p" onclick="saveProfile()">💾 Save Changes</button>
  </div>
</div>
<script>

const u=JSON.parse(localStorage.getItem('be_user')||'{}');
if(!u.id&&!u.username){window.location.href='/login.html'}
document.getElementById('sb-name').textContent=u.full_name||u.username||'User';
document.getElementById('sb-role').textContent=u.role||'user';
document.getElementById('sb-avatar').textContent=(u.full_name||u.username||'U')[0].toUpperCase();
if(u.profile_image){const img=document.createElement('img');img.src=u.profile_image;document.getElementById('sb-avatar').innerHTML='';document.getElementById('sb-avatar').appendChild(img)}
async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'}).catch(()=>{});localStorage.removeItem('be_user');window.location.href='/login.html'}

async function loadProfile(){
  try{
    const res=await fetch('/api/profile',{credentials:'include'});
    const d=await res.json();
    if(!d.success)return;
    const u=d.user;
    localStorage.setItem('be_user',JSON.stringify(u));
    document.getElementById('hdr-name').textContent=u.full_name||u.username;
    document.getElementById('hdr-email').textContent=u.email||u.username;
    document.getElementById('hdr-acct').textContent=u.account_id||'N/A';
    document.getElementById('f-name').value=u.full_name||'';
    document.getElementById('f-user').value=u.username||'';
    document.getElementById('f-phone').value=u.phone||'';
    document.getElementById('f-dob').value=u.dob||'';
    document.getElementById('f-aadhaar').value=u.aadhaar||'';
    document.getElementById('f-pan').value=u.pan||'';
    document.getElementById('f-addr').value=u.address||'';
    const av=document.getElementById('avatar-wrap');
    if(u.profile_image){av.innerHTML=`<img src="${u.profile_image}" alt="">`;document.getElementById('sb-avatar').innerHTML=`<img src="${u.profile_image}" alt="">`;}
    else{av.textContent=(u.full_name||u.username||'U')[0].toUpperCase()}
    document.getElementById('sb-name').textContent=u.full_name||u.username;
  }catch(e){}
}
loadProfile();

function handleImage(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const b64=e.target.result;
    document.getElementById('avatar-wrap').innerHTML=`<img src="${b64}" alt="">`;
    document.getElementById('sb-avatar').innerHTML=`<img src="${b64}" alt="">`;
    document.getElementById('avatar-wrap')._newImage=b64;
  };reader.readAsDataURL(file);
}

async function saveProfile(){
  const body={
    full_name:document.getElementById('f-name').value,
    username:document.getElementById('f-user').value,
    phone:document.getElementById('f-phone').value,
    dob:document.getElementById('f-dob').value,
    aadhaar:document.getElementById('f-aadhaar').value,
    pan:document.getElementById('f-pan').value.toUpperCase(),
    address:document.getElementById('f-addr').value,
  };
  const pin=document.getElementById('f-pin').value;
  if(pin)body.pin=pin;
  const img=document.getElementById('avatar-wrap')._newImage;
  if(img)body.profile_image=img;
  try{
    const res=await fetch('/api/profile/update',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    const d=await res.json();
    const a=document.getElementById('alert');
    if(d.success){a.className='alert ok show';a.textContent='✅ Profile updated!';loadProfile();}
    else{a.className='alert err show';a.textContent=d.message;}
    setTimeout(()=>a.className='alert',3000);
  }catch(e){}
}
</script>
</body>
</html>
