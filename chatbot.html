<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>BankEase – AI Assistant</title>
<style>
  :root{--p:#6366f1;--d:#4f46e5;--dk:#1e1b4b;--l:#eef2ff;--err:#ef4444;--ok:#10b981;--warn:#f59e0b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f8f9ff;display:flex;min-height:100vh;color:#1f2937}
  /* Sidebar */
  .sidebar{width:260px;background:linear-gradient(180deg,var(--dk),#312e81);min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .sb-logo{display:flex;align-items:center;gap:10px;padding:24px 24px 20px;font-size:1.25rem;font-weight:800;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
  .sb-logo .icon{width:36px;height:36px;background:rgba(99,102,241,.4);border-radius:10px;display:flex;align-items:center;justify-content:center}
  .sb-user{padding:16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
  .sb-avatar{width:40px;height:40px;background:linear-gradient(135deg,var(--p),var(--d));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
  .sb-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .sb-name{color:#fff;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-role{color:rgba(255,255,255,.5);font-size:.75rem}
  nav.sb-nav{flex:1;padding:0 12px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.9rem;font-weight:500;transition:all .2s;margin-bottom:4px}
  .nav-item:hover,.nav-item.active{background:rgba(255,255,255,.12);color:#fff}
  .nav-item.active{background:rgba(99,102,241,.35);color:#fff}
  .nav-item .ni{font-size:1.1rem;width:20px;text-align:center}
  .sb-logout{margin:0 12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.6);background:none;border:none;font-size:.9rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);transition:.2s}
  .sb-logout:hover{background:rgba(239,68,68,.2);color:#fca5a5}
  /* Main */
  .main{flex:1;padding:32px 36px;overflow-y:auto}
  .page-title{font-size:1.6rem;font-weight:800;color:var(--dk);margin-bottom:4px}
  .page-sub{color:#6b7280;font-size:.9rem;margin-bottom:32px}
  /* Grid & Buttons */
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .btn{padding:10px 22px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;border:none;transition:.25s;display:inline-flex;align-items:center;gap:7px}
  .btn-p{background:linear-gradient(135deg,var(--p),var(--d));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
  .btn-outline{border:2px solid var(--p);color:var(--p);background:transparent}
  
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;padding:32px;max-width:400px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.2);text-align:center;}
  .modal h3{font-size:1.4rem;font-weight:800;color:var(--dk);margin-bottom:10px}
  
  @media(max-width:768px){.sidebar{width:64px}.sb-name,.sb-role,.sb-user .sb-name,.sb-user .sb-role,.sb-logo span,.nav-item span,.sb-logout span{display:none}.main{padding:20px 16px}}

  /* Chat Specific */
  .chat-container{display:flex;flex-direction:column;height:calc(100vh - 64px)}
  .chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg-row{display:flex;gap:12px;align-items:flex-end;max-width:680px}
  .msg-row.user{flex-direction:row-reverse;margin-left:auto}
  .msg-bubble{padding:12px 18px;border-radius:18px;font-size:.9rem;line-height:1.6;max-width:520px;white-space:pre-wrap;word-break:break-word}
  .msg-row.bot .msg-bubble{background:#fff;border:1px solid #e5e7eb;border-radius:18px 18px 18px 4px;color:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--p),var(--d));color:#fff;border-radius:18px 18px 4px 18px}
  .msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
  .msg-avatar.bot{background:var(--l);color:var(--p)}
  .msg-avatar.user{background:linear-gradient(135deg,var(--p),var(--d));color:#fff}
  .chat-input-bar{padding:16px 20px;background:#fff;border-top:1px solid #e5e7eb;display:flex;gap:12px}
  .chat-input{flex:1;padding:12px 18px;border:2px solid #e5e7eb;border-radius:50px;font-size:.92rem;outline:none;font-family:'Inter',sans-serif;transition:border .2s}
  .chat-input:focus{border-color:var(--p)}
  .send-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--d));color:#fff;border:none;font-size:1.1rem;cursor:pointer;flex-shrink:0;transition:.2s;display:flex;align-items:center;justify-content:center}
  .send-btn:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(99,102,241,.4)}
  .quick-replies{display:flex;gap:8px;flex-wrap:wrap;padding:8px 20px 0}
  .qr-btn{padding:7px 14px;border:1.5px solid var(--p);border-radius:50px;font-size:.8rem;font-weight:600;color:var(--p);background:#fff;cursor:pointer;transition:.2s;white-space:nowrap}
  .qr-btn:hover{background:var(--l)}
  .typing{display:flex;gap:4px;padding:12px 18px;align-items:center}
  .typing span{width:7px;height:7px;border-radius:50%;background:#d1d5db;animation:bounce .8s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  .main{padding:0!important;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .chat-header{padding:20px 28px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .chat-header .bot-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--d));display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .online-dot{width:9px;height:9px;border-radius:50%;background:#10b981;display:inline-block;margin-right:5px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo"><div class="icon">🏦</div><span>BankEase</span></div>
  <div class="sb-user">
    <div class="sb-avatar" id="sb-avatar">U</div>
    <div><div class="sb-name" id="sb-name">Loading...</div><div class="sb-role" id="sb-role">User</div></div>
  </div>
  <nav class="sb-nav">
      <a href="/dashboard.html" class="nav-item"><span class="ni">🏠</span><span>Dashboard</span></a>
      <a href="/statement.html" class="nav-item"><span class="ni">📋</span><span>Statements</span></a>
      <a href="/profile.html" class="nav-item"><span class="ni">👤</span><span>Profile</span></a>
      <a href="/chatbot.html" class="nav-item active"><span class="ni">🤖</span><span>AI Assistant</span></a>
      <a href="/support.html" class="nav-item"><span class="ni">🎫</span><span>Support</span></a>
    </nav>
  <button class="sb-logout" onclick="logout()"><span class="ni">🚪</span><span>Logout</span></button>
</div>

<div class="main">
  <div class="chat-header">
    <div class="bot-icon">🤖</div>
    <div><div style="font-weight:700;color:var(--dk)">BankEase AI</div><div style="font-size:.8rem;color:#6b7280"><span class="online-dot"></span>Always Online</div></div>
  </div>
  <div class="quick-replies">
    <button class="qr-btn" onclick="send('What is my balance?')">💰 My Balance</button>
    <button class="qr-btn" onclick="send('Show my transactions')">📋 Transactions</button>
    <button class="qr-btn" onclick="send('Send money')">💸 Transfer</button>
    <button class="qr-btn" onclick="send('What is my account number?')">🏦 Account Info</button>
    <button class="qr-btn" onclick="send('Help')">❓ Help</button>
  </div>
  <div class="chat-msgs" id="msgs"></div>
  <div class="chat-input-bar">
    <input class="chat-input" id="chat-inp" placeholder="Ask me anything about your account..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div class="overlay" id="pin-modal">
  <div class="modal">
    <h3>🔒 Security Check</h3>
    <p style="color:#6b7280;font-size:0.9rem;margin-bottom:20px">Please enter your 4-digit PIN to securely view your account balance.</p>
    
    <input type="password" id="chat-pin-input" maxlength="4" placeholder="••••" style="text-align:center;letter-spacing:12px;font-size:1.8rem;font-weight:bold;margin-bottom:24px; padding: 15px; border-radius: 12px; width: 100%;">
    
    <div class="grid-2">
      <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="closePinModal()">Cancel</button>
      <button class="btn btn-p" style="width: 100%; justify-content: center;" onclick="verifyPin()">Confirm PIN</button>
    </div>
  </div>
</div>

<script>
const u=JSON.parse(localStorage.getItem('be_user')||'{}');
if(!u.id&&!u.username){window.location.href='/login.html'}
document.getElementById('sb-name').textContent=u.full_name||u.username||'User';
document.getElementById('sb-role').textContent=u.role||'user';
document.getElementById('sb-avatar').textContent=(u.full_name||u.username||'U')[0].toUpperCase();
if(u.profile_image){const img=document.createElement('img');img.src=u.profile_image;document.getElementById('sb-avatar').innerHTML='';document.getElementById('sb-avatar').appendChild(img)}

async function logout(){
    await fetch('/api/logout',{method:'POST',credentials:'include'}).catch(()=>{});
    localStorage.removeItem('be_user');
    window.location.href='/login.html';
}

const msgs=document.getElementById('msgs');

function addMsg(text,who){
  const row=document.createElement('div');
  row.className='msg-row '+who;
  row.innerHTML=`<div class="msg-avatar ${who}">${who==='bot'?'🤖':'👤'}</div>
                 <div class="msg-bubble">${text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  const row=document.createElement('div');
  row.className='msg-row bot';
  row.id='typing';
  row.innerHTML=`<div class="msg-avatar bot">🤖</div>
                 <div class="msg-bubble" style="padding:12px 16px">
                    <div class="typing"><span></span><span></span><span></span></div>
                 </div>`;
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function removeTyping(){
    const t=document.getElementById('typing');
    if(t)t.remove()
}

function send(text){
    document.getElementById('chat-inp').value=text;
    sendMsg();
}

async function sendMsg(){
  const inp=document.getElementById('chat-inp');
  const text=inp.value.trim();
  if(!text)return;
  
  addMsg(text,'user');
  inp.value='';
  showTyping();
  
  try{
    const res=await fetch('/api/chatbot',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({message:text})
    });
    const data=await res.json();
    removeTyping();
    
    if(data.success){
      addMsg(data.response,'bot');
      
      // NEW: Action Handling Logic
      if(data.action === 'open_transfer') {
          setTimeout(() => window.location.href='/dashboard.html', 1200);
      } else if (data.action === 'show_balance_pin') {
          setTimeout(() => openPinModal(), 800); // Opens the modal after 0.8 seconds
      }
    } else {
        addMsg('Sorry, something went wrong. Please try again.','bot');
    }
  } catch(e){
      removeTyping();
      addMsg('Network error. Please check your connection or ensure backend is running properly.','bot');
  }
}

// --- NEW PIN MODAL LOGIC ---
function openPinModal() {
  document.getElementById('pin-modal').classList.add('open');
  const input = document.getElementById('chat-pin-input');
  input.value = '';
  input.focus();
}

function closePinModal() {
  document.getElementById('pin-modal').classList.remove('open');
}

async function verifyPin() {
  const pin = document.getElementById('chat-pin-input').value;
  if(pin.length !== 4) {
    alert('Please enter a valid 4-digit PIN');
    return;
  }
  
  closePinModal();
  showTyping(); // Show typing indicator while verifying
  
  try {
    const res = await fetch('/api/verify-pin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({pin: pin})
    });
    const data = await res.json();
    removeTyping();
    
    if(data.success) {
        // Show success message with balance in bold
        addMsg(`✅ **Verification Successful**\n\nYour current account balance is: **₹${data.balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}**`, 'bot');
    } else {
        // Show error message
        addMsg(`❌ Security Error: ${data.message}. Please try again.`, 'bot');
    }
  } catch(e) {
    removeTyping();
    addMsg('Network error during verification.', 'bot');
  }
}

// Allow pressing Enter on the PIN modal
document.getElementById('chat-pin-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        verifyPin();
    }
});

// Welcome message
setTimeout(()=>addMsg(`👋 Hello! I'm your BankEase AI Assistant.\n\nI can help you with:\n• 💰 Check balance\n• 📋 Recent transactions\n• 💸 Transfer money\n• 🏦 Account information\n\nWhat can I help you with today?`,'bot'),300);
</script>
</body>
</html>
